<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emploi du temps</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:8px}
.container{max-width:1100px;margin:0 auto;background:#fff;border-radius:12px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{text-align:center;color:#2c3e50;font-size:1.1em;margin-bottom:4px}
.subtitle{text-align:center;color:#7f8c8d;font-size:.72em;margin-bottom:10px}
.tabs{display:flex;gap:4px;justify-content:center;margin-bottom:10px;background:#ecf0f1;padding:4px;border-radius:8px;max-width:400px;margin-left:auto;margin-right:auto}
.tab{flex:1;padding:7px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-weight:600;color:#555;font-size:.75em}
.tab.active{background:#fff;color:#2c3e50;box-shadow:0 1px 3px rgba(0,0,0,.1)}

.btn-add-main{display:block;width:100%;max-width:320px;margin:0 auto 12px;padding:14px 20px;background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;border:none;border-radius:10px;font-size:1em;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(39,174,96,.4);transition:.2s;letter-spacing:.3px}
.btn-add-main:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(39,174,96,.5)}
.btn-add-main:active{transform:scale(.97)}

.toolbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.toolbar button{padding:6px 10px;border:none;border-radius:6px;background:#3498db;color:#fff;font-weight:600;cursor:pointer;font-size:.72em}
.toolbar button.danger{background:#e74c3c}
.toolbar button.success{background:#27ae60}
.toolbar button.pdf{background:#e67e22}

.planning-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
.planning{display:grid;grid-template-columns:70px repeat(6,minmax(80px,1fr));gap:2px;background:#dfe6e9;padding:2px;border-radius:8px;min-width:620px}
.header{background:linear-gradient(135deg,#2c3e50,#34495e);color:#fff;padding:7px 3px;text-align:center;font-weight:600;font-size:.72em;border-radius:4px}
.header.samedi{background:linear-gradient(135deg,#8e44ad,#9b59b6)}
.hour{padding:4px;text-align:center;color:#555;font-size:.62em;background:#ecf0f1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:600;min-height:42px;white-space:nowrap}
.slot{background:#f8f9fa;border-radius:4px;min-height:42px;padding:3px;font-size:.68em;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:rgba(52,152,219,.3);user-select:none;-webkit-user-select:none;transition:.15s}
.slot:active{background:#d6ecfa;transform:scale(.97)}
.slot.filled{color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.slot.filled:hover{transform:scale(1.03);box-shadow:0 3px 8px rgba(0,0,0,.25)}
.slot .matiere{font-size:.95em;line-height:1.1;margin-bottom:1px}
.slot .prof{font-size:.75em;opacity:.95;line-height:1.1}
.slot .salle{font-size:.72em;opacity:.9;font-style:italic}

.panel{display:none}
.panel.active{display:block}
.salle-card{background:#f8f9fa;border-radius:8px;padding:10px;margin-bottom:8px;border-left:3px solid #3498db}
.salle-card h3{color:#2c3e50;margin-bottom:3px;font-size:.9em;display:flex;justify-content:space-between;align-items:center;gap:6px}
.salle-card .badge{font-size:.65em;padding:2px 6px;border-radius:10px;background:#3498db;color:#fff;font-weight:600;white-space:nowrap}
.salle-card .badge.free{background:#27ae60}
.salle-card .badge.busy{background:#e74c3c}
.salle-occupations{margin-top:6px;font-size:.75em;color:#555}
.occupation-item{padding:4px 6px;background:#fff;border-radius:4px;margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;border-left:2px solid #3498db}
.occupation-item .time{font-weight:600;color:#2c3e50;white-space:nowrap}
.empty-msg{color:#95a5a6;font-style:italic;font-size:.8em;padding:6px 0}
.salles-manager{background:#ecf0f1;border-radius:8px;padding:10px;margin-bottom:12px}
.salles-manager h3{color:#2c3e50;margin-bottom:8px;font-size:.85em}
.salles-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.salle-tag{background:#fff;padding:4px 8px;border-radius:16px;font-size:.75em;display:flex;align-items:center;gap:5px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.salle-tag button{background:none;border:none;color:#e74c3c;cursor:pointer;font-size:1em;font-weight:bold;padding:0;line-height:1}
.add-salle-form{display:flex;gap:6px}
.add-salle-form input{flex:1;padding:6px 10px;border:2px solid #dfe6e9;border-radius:6px;font-size:.8em;font-family:inherit;min-width:0}
.add-salle-form input:focus{outline:none;border-color:#3498db}
.add-salle-form button{padding:6px 10px;border:none;border-radius:6px;background:#27ae60;color:#fff;font-weight:600;cursor:pointer;font-size:.78em;white-space:nowrap}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;justify-content:center;align-items:center;padding:15px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:10px;padding:16px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}
.modal h2{margin-bottom:10px;color:#2c3e50;font-size:1em}
.modal label{display:block;margin-bottom:4px;color:#555;font-size:.78em;font-weight:600}
.modal input,.modal select{width:100%;padding:8px;border:2px solid #dfe6e9;border-radius:6px;margin-bottom:9px;font-size:.88em;font-family:inherit}
.modal input:focus,.modal select:focus{outline:none;border-color:#3498db}
.dispo-info{background:#e8f4fc;border-left:3px solid #3498db;padding:8px 10px;border-radius:5px;font-size:.72em;color:#2c3e50;margin-bottom:9px;line-height:1.3}
.dispo-info .titre{font-weight:700;margin-bottom:2px}
.modal-actions{display:flex;gap:6px;margin-top:5px}
.modal-actions button{flex:1;padding:9px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:.8em}
.btn-save{background:#27ae60;color:#fff}
.btn-cancel{background:#ecf0f1;color:#555}
.btn-delete{background:#e74c3c;color:#fff}
.legende{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;padding-top:10px;border-top:1px solid #ecf0f1}
.legende-item{display:flex;align-items:center;gap:5px;font-size:.75em;color:#555}
.legende-color{width:12px;height:12px;border-radius:3px}
</style>
</head>
<body>
<div class="container">
<h1>📚 Emploi du temps scolaire</h1>
<p class="subtitle">Clique sur une cellule pour modifier, ou sur le bouton vert pour ajouter</p>

<div class="tabs">
<button class="tab active" onclick="changerOnglet('edt',this)">📅 Emploi du temps</button>
<button class="tab" onclick="changerOnglet('salles',this)">🏫 Salles</button>
</div>

<div id="tab-edt" class="panel active">

<button class="btn-add-main" onclick="ouvrirAjoutRapide()">➕ Ajouter un cours</button>

<div class="toolbar">
<button class="pdf" onclick="exporterPDF()">📄 Exporter en PDF</button>
<button onclick="exporterJSON()">💾 Sauvegarder</button>
<button class="success" onclick="document.getElementById('restoreFile').click()">📂 Restaurer</button>
<button class="danger" onclick="toutEffacer()">🗑️ Tout effacer</button>
<input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restaurerJSON(event)">
</div>
<div class="planning-wrapper"><div class="planning" id="planning"></div></div>
<div class="legende" id="legende"></div>
</div>

<div id="tab-salles" class="panel">
<div class="salles-manager">
<h3>🛠️ Gérer les salles</h3>
<div class="salles-list" id="sallesList"></div>
<div class="add-salle-form">
<input type="text" id="newSalleInput" placeholder="Ex : B204" onkeypress="if(event.key==='Enter'){ajouterSalle();event.preventDefault();}">
<button onclick="ajouterSalle()">+ Ajouter</button>
</div>
</div>
<h3 style="color:#2c3e50;margin-bottom:8px;font-size:.9em;">📊 Occupation des salles</h3>
<div id="sallesOccupation"></div>
</div>
</div>

<div class="modal-overlay" id="modal">
<div class="modal">
<h2 id="modalTitle">Ajouter un cours</h2>

<div id="selectJourHeure">
<label>Jour</label>
<select id="inputJour">
<option value="0">Lundi</option>
<option value="1">Mardi</option>
<option value="2">Mercredi</option>
<option value="3">Jeudi</option>
<option value="4">Vendredi</option>
<option value="5">Samedi</option>
</select>
<label>Heure</label>
<select id="inputHeure">
<option value="0">7h-8h</option>
<option value="1">8h-9h</option>
<option value="2">9h-10h</option>
<option value="3">10h-11h</option>
<option value="4">11h-12h</option>
<option value="5">12h-13h</option>
<option value="6">13h-14h</option>
<option value="7">14h-15h</option>
<option value="8">15h-16h</option>
<option value="9">16h-17h</option>
<option value="10">17h-18h</option>
</select>
</div>

<label>Matière</label>
<input type="text" id="inputMatiere" placeholder="Ex : Mathématiques" list="matieresList">
<datalist id="matieresList">
<option value="Mathématiques"><option value="Français"><option value="Histoire-Géo"><option value="Anglais"><option value="Espagnol"><option value="SVT"><option value="Physique-Chimie"><option value="EPS"><option value="Arts plastiques"><option value="Musique"><option value="Technologie"><option value="Philosophie">
</datalist>

<label>Professeur (optionnel)</label>
<input type="text" id="inputProf" placeholder="Ex : M. Dupont">

<label>Salle</label>
<select id="inputSalle" onchange="verifierDisponibilite()"><option value="">— Aucune —</option></select>
<div id="dispoInfo" class="dispo-info" style="display:none;"></div>

<label>Couleur</label>
<select id="inputCouleur">
<option value="#e74c3c">🔴 Rouge</option>
<option value="#3498db">🔵 Bleu</option>
<option value="#27ae60">🟢 Vert</option>
<option value="#f39c12">🟠 Orange</option>
<option value="#9b59b6">🟣 Violet</option>
<option value="#1abc9c">🟦 Turquoise</option>
<option value="#e91e63">🩷 Rose</option>
<option value="#34495e">⚫ Gris foncé</option>
</select>

<div class="modal-actions">
<button class="btn-delete" id="btnDelete" onclick="supprimerCours()" style="display:none">🗑️ Supprimer</button>
<button class="btn-cancel" onclick="fermerModal()">Annuler</button>
<button class="btn-save" onclick="sauvegarderCours()">Enregistrer</button>
</div>
</div>
</div>

<script>
var JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var HEURES=['7h-8h','8h-9h','9h-10h','10h-11h','11h-12h','12h-13h','13h-14h','14h-15h','15h-16h','16h-17h','17h-18h'];
var emploiDuTemps=chargerDepuisStorage('emploiDuTemps',{});
var listeSalles=chargerDepuisStorage('listeSalles',['B101','B102','Amphi A']);
var slotEnEdition=null;
var modeAjoutRapide=false;

function changerOnglet(onglet,btn){
document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
btn.classList.add('active');
document.getElementById('tab-'+onglet).classList.add('active');
if(onglet==='salles')afficherSalles();
}

function afficher(){
var planning=document.getElementById('planning');
planning.innerHTML='';
planning.innerHTML+='<div class="header">Heure</div>';
JOURS.forEach(function(j,i){
var cls=i===5?'header samedi':'header';
planning.innerHTML+='<div class="'+cls+'">'+j+'</div>';
});
HEURES.forEach(function(heure,hi){
planning.innerHTML+='<div class="hour">'+heure+'</div>';
JOURS.forEach(function(_,ji){
var key=ji+'-'+hi;
var cours=emploiDuTemps[key];
var slot=document.createElement('div');
if(cours){
slot.className='slot filled';
slot.style.background=cours.couleur;
slot.innerHTML='<div class="matiere">'+cours.matiere+'</div>'+
(cours.prof?'<div class="prof">'+cours.prof+'</div>':'')+
(cours.salle?'<div class="salle">📍 '+cours.salle+'</div>':'');
}else{
slot.className='slot';
}
slot.onclick=function(e){
e.preventDefault();
e.stopPropagation();
ouvrirModal(ji,hi,cours||null);
};
planning.appendChild(slot);
});
});
afficherLegende();
}

function afficherLegende(){
var legende=document.getElementById('legende');
var matieres={};
Object.values(emploiDuTemps).forEach(function(c){
if(!matieres[c.matiere])matieres[c.matiere]=c.couleur;
});
if(Object.keys(matieres).length===0){
legende.innerHTML='<span style="color:#999;font-size:.8em">Aucun cours enregistré</span>';
return;
}
legende.innerHTML=Object.entries(matieres).map(function(entry){
return '<div class="legende-item"><div class="legende-color" style="background:'+entry[1]+'"></div><span>'+entry[0]+'</span></div>';
}).join('');
}

function afficherSalles(){
var list=document.getElementById('sallesList');
if(listeSalles.length===0){
list.innerHTML='<span style="color:#95a5a6;font-size:.8em;font-style:italic">Aucune salle</span>';
}else{
list.innerHTML=listeSalles.map(function(s){
return '<div class="salle-tag"><span>🏫 '+s+'</span><button onclick="supprimerSalle(\''+s+'\')" title="Supprimer">✕</button></div>';
}).join('');
}
var occup=document.getElementById('sallesOccupation');
if(listeSalles.length===0){
occup.innerHTML='<p class="empty-msg">Ajoute des salles pour voir leur occupation.</p>';
return;
}
var parSalle={};
listeSalles.forEach(function(s){parSalle[s]=[];});
Object.entries(emploiDuTemps).forEach(function(entry){
var key=entry[0],cours=entry[1];
if(!cours.salle)return;
var parts=key.split('-');
var ji=Number(parts[0]),hi=Number(parts[1]);
if(!parSalle[cours.salle])parSalle[cours.salle]=[];
parSalle[cours.salle].push({jour:JOURS[ji],heure:HEURES[hi],matiere:cours.matiere,jourIdx:ji,heureIdx:hi});
});
Object.values(parSalle).forEach(function(arr){
arr.sort(function(a,b){return a.jourIdx-b.jourIdx||a.heureIdx-b.heureIdx;});
});
occup.innerHTML=listeSalles.map(function(s){
var occupations=parSalle[s]||[];
var total=occupations.length;
var badgeCls=total===0?'free':'busy';
var badgeTxt=total===0?'Libre':total+' cours';
var html='<div class="salle-card"><h3>🏫 '+s+' <span class="badge '+badgeCls+'">'+badgeTxt+'</span></h3><div class="salle-occupations">';
if(total===0){
html+='<span class="empty-msg">Aucun cours planifié</span>';
}else{
html+=occupations.map(function(o){
return '<div class="occupation-item"><span>'+o.matiere+'</span><span class="time">'+o.jour+' · '+o.heure+'</span></div>';
}).join('');
}
html+='</div></div>';
return html;
}).join('');
}

function ajouterSalle(){
var input=document.getElementById('newSalleInput');
var nom=input.value.trim();
if(!nom)return;
if(listeSalles.indexOf(nom)!==-1){alert('Cette salle existe déjà');return;}
listeSalles.push(nom);
listeSalles.sort();
sauvegarderStorage('listeSalles',listeSalles);
input.value='';
afficherSalles();
mettreAJourSelectSalles();
}

function supprimerSalle(nom){
var utilisee=Object.values(emploiDuTemps).some(function(c){return c.salle===nom;});
if(utilisee){
if(!confirm('⚠️ La salle "'+nom+'" est utilisée. La supprimer quand même ?'))return;
Object.keys(emploiDuTemps).forEach(function(k){
if(emploiDuTemps[k].salle===nom)emploiDuTemps[k].salle='';
});
sauvegarderStorage('emploiDuTemps',emploiDuTemps);
afficher();
}else{
if(!confirm('Supprimer la salle "'+nom+'" ?'))return;
}
listeSalles=listeSalles.filter(function(s){return s!==nom;});
sauvegarderStorage('listeSalles',listeSalles);
afficherSalles();
mettreAJourSelectSalles();
}

function mettreAJourSelectSalles(){
var select=document.getElementById('inputSalle');
var valActuelle=select.value;
select.innerHTML='<option value="">— Aucune —</option>'+listeSalles.map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join('');
select.value=valActuelle;
}

function verifierDisponibilite(){
if(!slotEnEdition)return;
var salle=document.getElementById('inputSalle').value;
var info=document.getElementById('dispoInfo');
var key=slotEnEdition.jourIndex+'-'+slotEnEdition.heureIndex;
if(!salle){info.style.display='none';return;}
var occupations=Object.entries(emploiDuTemps).filter(function(e){return e[1].salle===salle&&e[0]!==key;}).map(function(e){
var parts=e[0].split('-');
var ji=Number(parts[0]),hi=Number(parts[1]);
return{jour:JOURS[ji],heure:HEURES[hi],matiere:e[1].matiere,jourIdx:ji,heureIdx:hi};
}).sort(function(a,b){return a.jourIdx-b.jourIdx||a.heureIdx-b.heureIdx;});
info.style.display='block';
if(occupations.length===0){
info.innerHTML='<div class="titre">✅ '+salle+' est libre cette semaine</div>Aucun autre cours n\'utilise cette salle.';
}else{
info.innerHTML='<div class="titre">📋 '+salle+' — '+occupations.length+' autre(s) occupation(s)</div>'+occupations.slice(0,4).map(function(o){return '• '+o.jour+' '+o.heure+' ('+o.matiere+')';}).join('<br>')+(occupations.length>4?'<br>… et '+(occupations.length-4)+' autre(s)':'');
}
}

function ouvrirAjoutRapide(){
modeAjoutRapide=true;
slotEnEdition={jourIndex:0,heureIndex:0};
var modal=document.getElementById('modal');
var title=document.getElementById('modalTitle');
var btnDelete=document.getElementById('btnDelete');
var info=document.getElementById('dispoInfo');
document.getElementById('selectJourHeure').style.display='block';
document.getElementById('inputJour').value='0';
document.getElementById('inputHeure').value='0';
title.textContent='➕ Ajouter un cours';
document.getElementById('inputMatiere').value='';
document.getElementById('inputProf').value='';
document.getElementById('inputSalle').value='';
document.getElementById('inputCouleur').value='#3498db';
btnDelete.style.display='none';
info.style.display='none';
mettreAJourSelectSalles();
modal.classList.add('active');
setTimeout(function(){document.getElementById('inputMatiere').focus();},100);
}

function ouvrirModal(jourIndex,heureIndex,cours){
modeAjoutRapide=false;
slotEnEdition={jourIndex:jourIndex,heureIndex:heureIndex};
var modal=document.getElementById('modal');
var title=document.getElementById('modalTitle');
var btnDelete=document.getElementById('btnDelete');
var info=document.getElementById('dispoInfo');
document.getElementById('selectJourHeure').style.display='none';
mettreAJourSelectSalles();
if(cours){
title.textContent='✏️ Modifier : '+JOURS[jourIndex]+' '+HEURES[heureIndex];
document.getElementById('inputMatiere').value=cours.matiere;
document.getElementById('inputProf').value=cours.prof||'';
document.getElementById('inputSalle').value=cours.salle||'';
document.getElementById('inputCouleur').value=cours.couleur;
btnDelete.style.display='block';
}else{
title.textContent='➕ Ajouter : '+JOURS[jourIndex]+' '+HEURES[heureIndex];
document.getElementById('inputMatiere').value='';
document.getElementById('inputProf').value='';
document.getElementById('inputSalle').value='';
document.getElementById('inputCouleur').value='#3498db';
btnDelete.style.display='none';
}
info.style.display='none';
modal.classList.add('active');
setTimeout(function(){document.getElementById('inputMatiere').focus();},100);
if(document.getElementById('inputSalle').value)verifierDisponibilite();
}

function fermerModal(){
document.getElementById('modal').classList.remove('active');
slotEnEdition=null;
modeAjoutRapide=false;
}

function sauvegarderCours(){
var matiere=document.getElementById('inputMatiere').value.trim();
if(!matiere){alert('Veuillez saisir une matière');return;}
var ji,hi;
if(modeAjoutRapide){
ji=parseInt(document.getElementById('inputJour').value);
hi=parseInt(document.getElementById('inputHeure').value);
slotEnEdition={jourIndex:ji,heureIndex:hi};
}else{
ji=slotEnEdition.jourIndex;
hi=slotEnEdition.heureIndex;
}
var key=ji+'-'+hi;
if(emploiDuTemps[key] && modeAjoutRapide){
if(!confirm('⚠️ Un cours existe déjà à '+JOURS[ji]+' '+HEURES[hi]+'. Le remplacer ?'))return;
}
emploiDuTemps[key]={
matiere:matiere,
prof:document.getElementById('inputProf').value.trim(),
salle:document.getElementById('inputSalle').value,
couleur:document.getElementById('inputCouleur').value
};
sauvegarderStorage('emploiDuTemps',emploiDuTemps);
fermerModal();
afficher();
}

function supprimerCours(){
if(!slotEnEdition)return;
if(!confirm('🗑️ Supprimer ce cours ?'))return;
var key=ssauvegarderStorage('emploiDuTemps',emploiDuTemps);
fermerModal();
afficher();
}

function sauvegarderStorage(cle,valeur){
try{localStorage.setItem(cle,JSON.stringify(valeur));}catch(e){}
}

function chargerDepuisStorage(cle,defaut){
try{
var val=JSON.parse(localStorage.getItem(cle));
return val!==null&&val!==undefined?val:defaut;
}catch(e){return defaut;}
}

/* ===== EXPORT PDF - UNE SEULE PAGE A4 ===== */
function exporterPDF(){
var win=window.open('','_blank');
if(!win){alert('Autorisez les pop-ups pour exporter en PDF');return;}
var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Emploi du temps</title>';
html+='<style>';
html+='*{box-sizing:border-box;margin:0;padding:0}';
html+='body{font-family:Arial,sans-serif;padding:4mm;color:#000;background:#fff}';
html+='h1{text-align:center;color:#2c3e50;margin-bottom:1px;font-size:14px}';
html+='p.sub{text-align:center;color:#666;font-size:8px;margin-bottom:4px}';
html+='table{border-collapse:collapse;width:100%;font-size:7px;table-layout:fixed}';
html+='th,td{border:1px solid #333;padding:1px;text-align:center;vertical-align:middle;word-wrap:break-word;overflow:hidden}';
html+='th{background:#2c3e50;color:#fff;font-weight:bold;font-size:8px;height:18px}';
html+='th.sam{background:#8e44ad}';
html+='td.hour{background:#ecf0f1;font-weight:bold;width:38px;font-size:7px;height:34px}';
html+='td.slot-cell{height:34px}';
html+='td.cours{color:#fff;font-weight:bold;padding:1px}';
html+='.mat{font-size:8px;line-height:1;font-weight:bold}';
html+='.pr{font-size:6px;opacity:.95;line-height:1}';
html+='.sa{font-size:6px;font-style:italic;line-height:1}';
html+='@page{size:A4 landscape;margin:4mm}';
html+='@media print{body{padding:0}h1{font-size:13px}p.sub{font-size:7px}th,td{height:auto}}';
html+='</style></head><body>';
html+='<h1>📚 Emploi du temps scolaire</h1>';
html+='<p class="sub">Temple du Savoir — Année '+(new Date().getFullYear())+'-'+(new Date().getFullYear()+1)+'</p>';
html+='<table><thead><tr><th style="width:38px">Heure</th>';
JOURS.forEach(function(j,i){
html+='<th'+(i===5?' class="sam"':'')+'>'+j+'</th>';
});
html+='</tr></thead><tbody>';
HEURES.forEach(function(heure,hi){
html+='<tr><td class="hour">'+heure+'</td>';
JOURS.forEach(function(_,ji){
var key=ji+'-'+hi;
var c=emploiDuTemps[key];
if(c){
html+='<td class="cours slot-cell" style="background:'+c.couleur+'">';
html+='<div class="mat">'+c.matiere+'</div>';
if(c.prof)html+='<div class="pr">'+c.prof+'</div>';
if(c.salle)html+='<div class="sa">📍'+c.salle+'</div>';
html+='</td>';
}else{
html+='<td class="slot-cell"></td>';
}
});
html+='</tr>';
});
html+='</tbody></table>';
html+='<p style="text-align:center;font-size:6px;color:#999;margin-top:3px">Généré le '+new Date().toLocaleDateString('fr-FR')+'</p>';
html+='</body></html>';
win.document.write(html);
win.document.close();
setTimeout(function(){win.print();},500);
}

function exporterJSON(){
var data=JSON.stringify({emploiDuTemps:emploiDuTemps,listeSalles:listeSalles},null,2);
var blob=new Blob([data],{type:'application/json'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;
a.download='emploi-du-temps-'+new Date().toISOString().split('T')[0]+'.json';
a.click();
URL.revokeObjectURL(url);
}

function restaurerJSON(event){
var file=event.target.files[0];
if(!file)return;
if(!confirm('⚠️ Cette action va REMPLACER tout votre emploi du temps actuel par le contenu du fichier. Continuer ?')){event.target.value='';return;}
var reader=new FileReader();
reader.onload=function(e){
try{
var data=JSON.parse(e.target.result);
if(data.emploiDuTemps){
emploiDuTemps=data.emploiDuTemps;
listeSalles=data.listeSalles||[];
}else{
emploiDuTemps=data;
}
sauvegarderStorage('emploiDuTemps',emploiDuTemps);
sauvegarderStorage('listeSalles',listeSalles);
afficher();
afficherSalles();
mettreAJourSelectSalles();
alert('✅ Restauration réussie ! Votre emploi du temps a été rechargé.');
}catch(err){
alert('❌ Fichier invalide. Assurez-vous que c\'est un fichier .json généré par ce site.');
}
};
reader.readAsText(file);
event.target.value='';
}

function toutEffacer(){
if(!confirm('⚠️ Effacer tout l\'emploi du temps ?'))return;
emploiDuTemps={};
sauvegarderStorage('emploiDuTemps',emploiDuTemps);
afficher();
}

document.getElementById('modal').addEventListener('click',function(e){
if(e.target.id==='modal')fermerModal();
});
document.addEventListener('keydown',function(e){
if(e.key==='Escape')fermerModal();
});

afficher();
mettreAJourSelectSalles();
</script>
</body>
</html>
